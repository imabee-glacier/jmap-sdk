[package]
name = "glacier-mail"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "JMAP email service for Meta Muse and MCP agents"
repository = "https://github.com/imabee-glacier/glacier-mail"
readme = "README.md"
keywords = ["jmap", "email", "mcp", "agent", "stalwart"]
publish = false

[dependencies]
anyhow = "1"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
fs2 = "0.4"
tempfile = "3"
zeroize = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rmcp = { version = "3.8", features = ["transport-io"] }
rusqlite = { version = "0.37", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
url = "2"

[dev-dependencies]
axum = "0.8"

[lints.clippy]
unwrap_used = "warn"
