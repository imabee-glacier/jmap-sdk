[licenses]
# Permissive licenses present in the dependency tree. LGPL is not allowed;
# r-efi offers MIT OR Apache-2.0 alongside it.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# This crate and workspace-hack are publish = false, so they need no license.
[licenses.private]
ignore = true
